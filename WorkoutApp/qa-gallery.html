<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>68 Exercises &amp; Diagrams — Fact-Check &amp; QA Gallery</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <style>
    .qa-shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px 16px 60px;
    }
    .qa-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .qa-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }
    .qa-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qa-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .qa-row-num {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.14);
      padding: 2px 7px;
      border-radius: 6px;
    }
    .qa-filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <div class="qa-shell">
    <header class="qa-header">
      <div>
        <span class="eyebrow-label">FACT-CHECK &amp; VISUAL DIAGRAM AUDIT</span>
        <h1 style="margin:0;font-size:24px;">All 68 Exercises &amp; 11 Workout Formats</h1>
      </div>
      <a href="./index.html" class="secondary-pill-btn">← Back to Workout Generator</a>
    </header>

    <div class="qa-filter-bar">
      <input id="qaSearch" type="search" placeholder="Search exercise, muscle, equipment, or pose..." class="search-input" style="max-width:340px;" />
      <button class="secondary-pill-btn" data-filter="all" type="button">All (68)</button>
      <button class="secondary-pill-btn" data-filter="audited" type="button">🔬 Muscle Audit Updated</button>
      <button class="secondary-pill-btn" data-filter="Upper Body" type="button">Upper Body</button>
      <button class="secondary-pill-btn" data-filter="Core" type="button">Core</button>
      <button class="secondary-pill-btn" data-filter="Legs" type="button">Legs</button>
    </div>

    <div id="qaExerciseGrid" class="qa-grid"></div>
  </div>

  <script type="module">
    import { DataService } from './src/services/dataService.js';
    import { SPECIFIC_MUSCLES } from './src/engine/muscleLoadAnalyzer.js';

    const ds = new DataService();
    await ds.init('./data/sheet-data.json', './data/enrichments.json');

    let activeFilter = 'all';
    const grid = document.getElementById('qaExerciseGrid');
    const searchInput = document.getElementById('qaSearch');

    function render() {
      const q = (searchInput.value || '').trim().toLowerCase();
      const list = ds.sheetData.exercises.filter(ex => {
        if (activeFilter === 'audited' && !ex.auditUpdated) return false;
        if (['Upper Body', 'Core', 'Legs'].includes(activeFilter) && ex.bodyCategories[activeFilter] !== 'Pri') {
          return false;
        }
        if (q) {
          const hay = `${ex.name} ${ex.equipment} ${ex.enrichment?.summary || ''} ${ex.enrichment?.pose || ''}`.toLowerCase();
          return hay.includes(q);
        }
        return true;
      });

      grid.innerHTML = list.map(ex => {
        const enrich = ex.enrichment || {};
        const pri = SPECIFIC_MUSCLES.filter(m => ex.muscles[m] === 'Pri');
        const sec = SPECIFIC_MUSCLES.filter(m => ex.muscles[m] === 'Sec');
        return `
          <article class="qa-card" data-exercise-id="${ex.id}">
            <div class="qa-card-top">
              <div>
                <span class="qa-row-num">Sheet Row #${ex.row} • Pose: ${enrich.pose}</span>
                <h2 style="margin:4px 0 0;font-size:17px;">${ex.name}</h2>
              </div>
              <span class="mini-tag">${ex.equipment}</span>
            </div>
            <div class="diagram-container">
              <img src="./${enrich.diagram}" alt="${ex.name} diagram" class="exercise-diagram-img" loading="lazy" />
            </div>
            <div class="badge-row">
              ${pri.map(m => `<span class="mini-tag pri-muscle">Pri: ${m}</span>`).join('')}
              ${sec.map(m => `<span class="mini-tag sec-muscle">Sec: ${m}</span>`).join('')}
            </div>
            <p class="modal-lead" style="font-size:13px;">${enrich.summary}</p>
            <ol class="steps-list" style="font-size:12.5px;">
              ${(enrich.steps || []).map(s => `<li>${s}</li>`).join('')}
            </ol>
            <div class="form-tip-box" style="font-size:12px;">
              <strong>💡 Form Cue:</strong> ${enrich.formTip}
            </div>
            ${ex.auditUpdated ? `<div class="audit-note-box" style="font-size:11.5px;"><strong>🔬 Audit Update:</strong> ${ex.auditNote}</div>` : ''}
          </article>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', render);
    document.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeFilter = btn.getAttribute('data-filter');
        render();
      });
    });

    render();
  </script>
</body>
</html>
